<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to track and manage your personal expenses." />
  <title>Log In - Expense Tracker</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary">

  <a class="visually-hidden-focusable skip-link" href="#login-form">Skip to login form</a>

  <main class="container" style="max-width: 420px;">
    <div class="text-center mb-4">
      <span class="display-6" aria-hidden="true">💵</span>
      <h1 class="h3 mt-2">Expense Tracker</h1>
      <p class="text-muted">Log in to view and manage your expenses.</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">

        <div id="alert-box" class="alert d-none" role="alert" aria-live="polite"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="2"
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="4"
            />
            <div class="form-text">
              No account yet? Just enter a username and password and we'll create one for you.
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="login-btn">
            Log In / Sign Up
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-muted small mt-3">CS4241 - Assignment 3: Persistence</p>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
